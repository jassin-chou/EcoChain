name: EcoChain MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Unit Tests ─────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only torch for CI speed)
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric

      - name: Smoke-test GNN import
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from models.gnn import build_graph, predict, N_SPECIES
          g = build_graph({'grass': 3, 'rabbit': 2, 'fox': 1})
          print('Graph nodes:', g.x.shape[0])
          result = predict({'grass': 3, 'rabbit': 2, 'fox': 1})
          assert 5.0 <= result['score'] <= 100.0, f'Score out of range: {result[\"score\"]}'
          assert len(result['top_recommendations']) == 5
          print('Score:', result['score'])
          print('Recommendations:', result['top_recommendations'])
          print('GNN smoke test PASSED ✅')
          "

      - name: Verify eco_score formula (no NN required)
        run: |
          python train.py --score_test

      - name: Check for leaked secrets
        run: |
          # Fail if a real Firebase private key is committed
          if grep -r "BEGIN PRIVATE KEY" --include="*.json" --include="*.py" --include="*.env" .; then
            echo "❌ PRIVATE KEY DETECTED IN REPO — do not commit serviceAccountKey.json"
            exit 1
          fi
          echo "✅ No leaked secrets found"

  # ── 2. Train GNN (triggered on main push with real data) ─────────────────
  train:
    name: Train GNN Model
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric numpy

      - name: Train GNN (synthetic data only, 20 epochs for CI speed)
        run: |
          mkdir -p models
          python train.py --n 2000 --epochs 20

      - name: Verify model file was created
        run: |
          ls -lh models/ecochain_gnn.pt
          python -c "
          import torch
          state = torch.load('models/ecochain_gnn.pt', map_location='cpu', weights_only=True)
          print('Model keys:', list(state.keys())[:3], '...')
          print('✅ Model checkpoint valid')
          "

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecochain-gnn-model
          path: models/ecochain_gnn.pt
          retention-days: 30

  # ── 3. Deploy to Render ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, train]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deployment
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP status: %{http_code}\n"
          echo "✅ Render deploy triggered"

      - name: Wait for deployment & health check
        run: |
          echo "Waiting 60s for Render to boot..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_APP_URL }}/health" || echo "000")
          echo "Health check HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Health check returned $STATUS (Render free tier may still be warming up)"
          else
            echo "✅ Deployment healthy"
          fi
